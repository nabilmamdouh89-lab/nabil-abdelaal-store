<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محلات نبيل عبد العال | للمواد الغذائية</title>
  <style>
    :root {
      --navy: #071936;
      --navy-2: #0e2a5c;
      --navy-3: #173b7d;
      --gold: #f5b727;
      --gold-2: #ffca47;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f1d35;
      --muted: #64748b;
      --border: #dce4ef;
      --green: #15803d;
      --red: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      color: #fff;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(7, 25, 54, 0.18);
    }

    .nav-wrap {
      max-width: 1150px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      font-size: 20px;
      color: var(--gold-2);
    }

    .brand p {
      font-size: 13px;
      color: #dbeafe;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-gold {
      background: var(--gold);
      color: var(--navy);
    }

    .btn-gold:hover {
      background: var(--gold-2);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    .btn-navy {
      background: var(--navy-2);
      color: #fff;
    }

    .btn-green {
      background: var(--green);
      color: #fff;
    }

    .btn-red {
      background: var(--red);
      color: #fff;
    }

    .container {
      max-width: 1150px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .hero {
      background: linear-gradient(120deg, var(--navy-2), var(--navy-3));
      color: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .hero h2 {
      font-size: 22px;
      margin-bottom: 6px;
      color: var(--gold-2);
    }

    .badge {
      background: rgba(245, 183, 39, 0.18);
      border: 1px solid var(--gold);
      color: var(--gold-2);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
    }

    .cat-btn.active {
      background: var(--navy-2);
      color: #fff;
      border-color: var(--navy-2);
    }

    .search-input {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      min-width: 220px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 10px rgba(15, 29, 53, 0.04);
    }

    .cat-tag {
      display: inline-block;
      font-size: 12px;
      background: #eef2ff;
      color: var(--navy-2);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .price {
      font-size: 17px;
      font-weight: bold;
      color: var(--green);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 25, 54, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .cart-item, .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eef2f6;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-controls button {
      padding: 4px 10px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .total-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin: 14px 0;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 24px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <div class="brand">
        <h1>محلات نبيل عبد العال</h1>
        <p>للمواد الغذائية • واتساب: 01285405535</p>
      </div>
      <div class="nav-actions">
        <button type="button" class="btn-outline" id="adminBtn">إدارة المحل</button>
        <button type="button" class="btn-gold" id="cartBtn">السلة (<span id="cartCount">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h2>أهلاً بك في محلات نبيل عبد العال</h2>
        <p>كل مستلزمات البيت من السلع الأساسية والزيوت والألبان والمعلبات بأفضل الأسعار.</p>
      </div>
      <div class="badge" id="heroBadge">جاهز لاستقبال طلباتكم</div>
    </section>

    <div class="toolbar">
      <div class="categories" id="categoriesBox"></div>
      <input type="search" id="searchInput" class="search-input" placeholder="ابحث عن منتج..." />
    </div>

    <section class="grid" id="productsGrid"></section>
  </main>

  <div class="modal-backdrop" id="cartModal">
    <div class="modal">
      <div class="modal-header">
        <h3>سلة المشتريات</h3>
        <button type="button" class="btn-red" data-close="cartModal">إغلاق</button>
      </div>
      <div id="cartItemsBox"></div>
      <div class="total-box">
        <span>الإجمالي:</span>
        <span id="cartTotal">0.00 ج.م</span>
      </div>
      <div class="form-group">
        <label for="customerName">اسم العميل</label>
        <input type="text" id="customerName" placeholder="اكتب اسمك" />
      </div>
      <div class="form-group">
        <label for="customerAddress">العنوان أو رقم التليفون</label>
        <input type="text" id="customerAddress" placeholder="اكتب العنوان ورقم الموبايل" />
      </div>
      <button type="button" class="btn-green" style="width: 100%;" id="checkoutBtn">إرسال الطلب على واتساب</button>
    </div>
  </div>

  <div class="modal-backdrop" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <h3>لوحة إدارة المحل</h3>
        <button type="button" class="btn-red" data-close="adminModal">إغلاق</button>
      </div>

      <div class="form-group">
        <label for="newProdName">اسم منتج جديد</label>
        <input type="text" id="newProdName" placeholder="مثال: سكر أبيض 1 كيلو" />
      </div>
      <div class="form-group">
        <label for="newProdCat">القسم</label>
        <select id="newProdCat">
          <option value="سلع أساسية">سلع أساسية</option>
          <option value="زيوت وسمن">زيوت وسمن</option>
          <option value="ألبان ومشروبات">ألبان ومشروبات</option>
          <option value="معلبات ومنظفات">معلبات ومنظفات</option>
        </select>
      </div>
      <div class="form-group">
        <label for="newProdPrice">السعر (بالجنيه)</label>
        <input type="number" id="newProdPrice" placeholder="مثال: 35" min="1" step="0.5" />
      </div>
      <button type="button" class="btn-navy" style="width: 100%; margin-bottom: 18px;" id="addProdBtn">إضافة المنتج للمتجر</button>

      <h4 style="margin-bottom: 8px;">الطلبات المسجلة</h4>
      <div id="adminOrdersBox"></div>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "201285405535";
    const ADMIN_PASS = "1234";

    const DEFAULT_PRODUCTS = [
      { id: 1, name: "أرز مصري فاخر 1 كجم", category: "سلع أساسية", price: 32 },
      { id: 2, name: "مكرونة متنوعة 400 جم", category: "سلع أساسية", price: 14 },
      { id: 3, name: "زيت خليط 700 مل", category: "زيوت وسمن", price: 52 },
      { id: 4, name: "سمنة نباتي 700 جم", category: "زيوت وسمن", price: 68 },
      { id: 5, name: "حليب كامل الدسم 1 لتر", category: "ألبان ومشروبات", price: 42 },
      { id: 6, name: "صلصة طماطم 300 جم", category: "معلبات ومنظفات", price: 18 }
    ];

    const CATEGORIES = ["الكل", "سلع أساسية", "زيوت وسمن", "ألبان ومشروبات", "معلبات ومنظفات"];

    let products = JSON.parse(localStorage.getItem("nabil_products_v1") || "null") || DEFAULT_PRODUCTS.slice();
    let cart = JSON.parse(localStorage.getItem("nabil_cart_v1") || "[]");
    let orders = JSON.parse(localStorage.getItem("nabil_orders_v1") || "[]");
    let selectedCategory = "الكل";
    let searchQuery = "";

    function saveState() {
      localStorage.setItem("nabil_products_v1", JSON.stringify(products));
      localStorage.setItem("nabil_cart_v1", JSON.stringify(cart));
      localStorage.setItem("nabil_orders_v1", JSON.stringify(orders));
    }

    function formatPrice(num) {
      return Number(num || 0).toFixed(2) + " ج.م";
    }

    function updateHeroBadge() {
      const badge = document.getElementById("heroBadge");
      if (badge) {
        badge.textContent = "عدد المنتجات المتاحة: " + products.length;
      }
    }

    function renderCategories() {
      const box = document.getElementById("categoriesBox");
      if (!box) return;
      box.innerHTML = CATEGORIES.map((cat) => {
        const activeClass = cat === selectedCategory ? "cat-btn active" : "cat-btn";
        return `<button type="button" class="${activeClass}" data-cat="${cat}">${cat}</button>`;
      }).join("");
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      if (!grid) return;
      const filtered = products.filter((p) => {
        const matchCat = selectedCategory === "الكل" || p.category === selectedCategory;
        const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-msg">لا توجد منتجات مطابقة للبحث حالياً.</div>`;
        return;
      }

      grid.innerHTML = filtered.map((p) => `
        <article class="card">
          <div>
            <span class="cat-tag">${p.category}</span>
            <h3>${p.name}</h3>
            <div class="price">${formatPrice(p.price)}</div>
          </div>
          <button type="button" class="btn-navy" data-add="${p.id}">أضف إلى السلة</button>
        </article>
      `).join("");
    }

    function addToCart(id) {
      const prod = products.find((item) => item.id === id);
      if (!prod) return;
      const existing = cart.find((item) => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
      }
      saveState();
      updateCartUI();
    }

    function changeQty(id, delta) {
      const idx = cart.findIndex((item) => item.id === id);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) {
        cart.splice(idx, 1);
      }
      saveState();
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById("cartCount");
      const box = document.getElementById("cartItemsBox");
      const totalEl = document.getElementById("cartTotal");

      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

      if (countEl) countEl.textContent = totalQty;
      if (totalEl) totalEl.textContent = formatPrice(totalPrice);

      if (!box) return;
      if (cart.length === 0) {
        box.innerHTML = `<div class="empty-msg">السلة فارغة حالياً.</div>`;
        return;
      }

      box.innerHTML = cart.map((item) => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong>
            <div style="font-size: 12px; color: #64748b;">${formatPrice(item.price)} للقطعة</div>
          </div>
          <div class="qty-controls">
            <button type="button" class="btn-navy" data-qty="${item.id}" data-delta="-1">-</button>
            <span>${item.qty}</span>
            <button type="button" class="btn-navy" data-qty="${item.id}" data-delta="1">+</button>
          </div>
        </div>
      `).join("");
    }

    function renderAdminOrders() {
      const box = document.getElementById("adminOrdersBox");
      if (!box) return;
      if (!orders || orders.length === 0) {
        box.innerHTML = `<div class="empty-msg">لا توجد طلبات مسجلة حتى الآن.</div>`;
        return;
      }

      box.innerHTML = orders.map((o) => {
        const itemsText = (o.items || []).map((i) => `${i.name} (${i.qty})`).join("، ");
        return `
          <div class="list-row">
            <div>
              <strong>${o.customerName || "عميل"}</strong>
              <div style="font-size: 12px; color: #64748b;">${o.customerAddress || ""}</div>
              <div style="font-size: 12px; color: #334155;">${itemsText}</div>
            </div>
            <strong>${formatPrice(o.total)}</strong>
          </div>
        `;
      }).join("");
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add("open");
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove("open");
    }

    document.getElementById("cartBtn").addEventListener("click", () => {
      updateCartUI();
      openModal("cartModal");
    });

    document.getElementById("adminBtn").addEventListener("click", () => {
      const entered = prompt("أدخل كلمة سر لوحة الإدارة:");
      if (entered === null) return;
      if (entered.trim() === ADMIN_PASS) {
        renderAdminOrders();
        openModal("adminModal");
      } else {
        alert("كلمة السر غير صحيحة.");
      }
    });

    document.querySelectorAll("[data-close]").forEach((btn) => {
      btn.addEventListener("click", () => closeModal(btn.getAttribute("data-close")));
    });

    document.getElementById("categoriesBox").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      selectedCategory = btn.getAttribute("data-cat");
      renderCategories();
      renderProducts();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value || "";
      renderProducts();
    });

    document.getElementById("productsGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-add]");
      if (!btn) return;
      addToCart(Number(btn.getAttribute("data-add")));
    });

    document.getElementById("cartItemsBox").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-qty]");
      if (!btn) return;
      changeQty(Number(btn.getAttribute("data-qty")), Number(btn.getAttribute("data-delta")));
    });

    document.getElementById("addProdBtn").addEventListener("click", () => {
      const nameInput = document.getElementById("newProdName");
      const catInput = document.getElementById("newProdCat");
      const priceInput = document.getElementById("newProdPrice");

      const name = (nameInput.value || "").trim();
      const category = catInput.value;
      const price = parseFloat(priceInput.value);

      if (!name || isNaN(price) || price <= 0) {
        alert("من فضلك اكتب اسم المنتج وسعراً صحيحاً.");
        return;
      }

      products.push({
        id: Date.now(),
        name: name,
        category: category,
        price: price
      });

      nameInput.value = "";
      priceInput.value = "";
      saveState();
      updateHeroBadge();
      renderProducts();
      alert("تمت إضافة المنتج بنجاح.");
    });

    document.getElementById("checkoutBtn").addEventListener("click", () => {
      if (cart.length === 0) {
        alert("السلة فارغة، أضف منتجات أولاً.");
        return;
      }

      const customerName = (document.getElementById("customerName").value || "").trim();
      const customerAddress = (document.getElementById("customerAddress").value || "").trim();

      if (!customerName || !customerAddress) {
        alert("من فضلك اكتب الاسم والعنوان أو رقم التليفون.");
        return;
      }

      const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      orders.unshift({
        id: Date.now(),
        customerName: customerName,
        customerAddress: customerAddress,
        items: cart.slice(),
        total: total
      });

      const lines = cart.map((item) => `- ${item.name} × ${item.qty} (${formatPrice(item.price * item.qty)})`);
      const message = [
        "طلب جديد - محلات نبيل عبد العال",
        "الاسم: " + customerName,
        "العنوان/الموبايل: " + customerAddress,
        "المنتجات:",
        ...lines,
        "الإجمالي: " + formatPrice(total)
      ].join("\n");

      cart = [];
      saveState();
      updateCartUI();
      closeModal("cartModal");

      const waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);
      window.open(waUrl, "_blank");
    });

    updateHeroBadge();
    renderCategories();
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
