<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة إدارة محلات نبيل عبد العال</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --navy: #0a2540;
    --primary: #0f3d68;
    --danger: #dc2626;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 14px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 20px; color: var(--navy); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab-btn { width: auto; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 700; }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  input, select, textarea, button { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; }
  button { cursor: pointer; font-weight: 700; }
  .btn-primary { background: var(--primary); color: #fff; border: none; }
  .btn-secondary { background: #e2e8f0; color: var(--navy); border: none; }
  .btn-danger { background: var(--danger); color: #fff; border: none; width: auto; padding: 7px 12px; font-size: 13px; }
  .btn-sm { width: auto; padding: 8px 12px; font-size: 13px; background: #fff; }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .item-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
  .msg { font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
  .img-box {
    border: 1px dashed #94a3b8;
    border-radius: 12px;
    padding: 10px;
    background: #f8fafc;
    display: grid;
    gap: 8px;
  }
  .img-preview-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .img-preview {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid var(--border);
    background: #e2e8f0;
  }
  .new-cat-box {
    display: none;
    gap: 8px;
    background: #f8fafc;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .new-cat-box.open { display: flex; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>إدارة محلات نبيل عبد العال</h1>
      <div style="font-size:12px;color:var(--muted);">المزامنة الفورية مع قاعدة البيانات</div>
    </div>
    <button id="reloadAllBtn" type="button" class="btn-sm">تحديث البيانات</button>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="productsTab">المنتجات (<span id="admProdCount">0</span>)</button>
    <button type="button" class="tab-btn" data-tab="ordersTab">الطلبات (<span id="admOrdCount">0</span>)</button>
    <button type="button" class="tab-btn" data-tab="complaintsTab">الشكاوى (<span id="admSupCount">0</span>)</button>
  </div>

  <!-- تبويب المنتجات -->
  <section id="productsTab" class="card">
    <h2 style="margin:0 0 12px;font-size:17px;color:var(--navy);">إضافة / تعديل منتج</h2>
    <form id="productForm" style="display:grid;gap:10px;">
      <input id="prodId" type="hidden" />
      <div class="grid-2">
        <input id="prodName" type="text" placeholder="اسم المنتج (مثال: سكر كيلو، زيت 5لتر)" required />
        <input id="prodPrice" type="number" step="0.01" min="0" placeholder="السعر بالجنيه" required />
      </div>

      <!-- اختيار القسم + زر إضافة قسم جديد -->
      <div style="display:grid;gap:8px;">
        <div class="inline-row">
          <select id="prodCategory" style="flex:1;"></select>
          <button id="toggleNewCatBtn" type="button" class="btn-secondary" style="width:auto;white-space:nowrap;">+ إضافة قسم</button>
        </div>
        <div id="newCatBox" class="new-cat-box">
          <input id="newCatInput" type="text" placeholder="اكتب اسم القسم الجديد (مثال: مخبوزات، مجمدات)" />
          <button id="saveNewCatBtn" type="button" class="btn-primary" style="width:auto;white-space:nowrap;">حفظ القسم</button>
        </div>
      </div>

      <!-- إضافة صورة المنتج (زر اختيار من الجهاز/الكاميرا + رابط اختياري) -->
      <div class="img-box">
        <div class="inline-row" style="flex-wrap:wrap;">
          <input id="prodImageFile" type="file" accept="image/*" style="display:none;" />
          <button id="pickImageBtn" type="button" class="btn-secondary" style="width:auto;">📷 إضافة صورة المنتج</button>
          <button id="clearImageBtn" type="button" class="btn-sm" style="display:none;">إزالة الصورة</button>
          <span id="imgStatusText" style="font-size:12px;color:var(--muted);">اختر صورة من الهاتف أو الصق رابطاً</span>
        </div>
        <input id="prodImage" type="text" placeholder="أو الصق رابط صورة المنتج هنا (اختياري)" />
        <div id="imgPreviewWrap" class="img-preview-wrap" style="display:none;">
          <img id="imgPreview" class="img-preview" alt="معاينة الصورة" />
          <span style="font-size:12px;color:var(--primary);font-weight:700;">معاينة صورة المنتج جاهزة</span>
        </div>
      </div>

      <input id="prodDesc" type="text" placeholder="وصف مختصر (اختياري)" />
      <div style="display:flex;gap:8px;">
        <button type="submit" class="btn-primary">حفظ المنتج في المتجر</button>
        <button id="resetFormBtn" type="button" class="btn-sm">إلغاء التعديل</button>
      </div>
    </form>
    <div id="prodMsg" class="msg"></div>

    <h3 style="margin:18px 0 8px;font-size:16px;color:var(--navy);">قائمة المنتجات الحالية</h3>
    <div id="adminProductsList"></div>
  </section>

  <!-- تبويب الطلبات -->
  <section id="ordersTab" class="card hidden">
    <h2 style="margin:0 0 10px;font-size:17px;color:var(--navy);">الطلبات الواردة</h2>
    <div id="adminOrdersList"></div>
  </section>

  <!-- تبويب الشكاوى -->
  <section id="complaintsTab" class="card hidden">
    <h2 style="margin:0 0 10px;font-size:17px;color:var(--navy);">الشكاوى والاستفسارات</h2>
    <div id="adminComplaintsList"></div>
  </section>
</div>

<script>
const DB_URL = "https://nabil-store-35485-default-rtdb.firebaseio.com";
const DEFAULT_CATS = [
  "السلع الاساسيه",
  "الزيوت والسمنات",
  "معلبات",
  "منظفات",
  "ألبان"
];

let products = [];
let categories = [...DEFAULT_CATS];
let uploadedImageDataUrl = "";

function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

async function dbGet(path) {
  const sep = path.includes("?") ? "&" : "?";
  const res = await fetch(`${DB_URL}${path}${sep}_t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function dbPut(path, body) {
  const res = await fetch(`${DB_URL}${path}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function dbDelete(path) {
  const res = await fetch(`${DB_URL}${path}`, { method: "DELETE" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

function renderCategorySelect(selectedValue = "") {
  const sel = document.getElementById("prodCategory");
  const current = selectedValue || sel.value || DEFAULT_CATS[0];
  const merged = Array.from(new Set([...DEFAULT_CATS, ...categories, ...products.map(p => p.category).filter(Boolean)]));
  sel.innerHTML = merged.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  if (merged.includes(current)) {
    sel.value = current;
  }
}

async function loadCategories() {
  try {
    const raw = await dbGet("/categories.json");
    let fetched = [];
    if (Array.isArray(raw)) {
      fetched = raw.map(x => typeof x === "string" ? x : x?.name).filter(Boolean);
    } else if (raw && typeof raw === "object") {
      fetched = Object.values(raw).map(x => typeof x === "string" ? x : x?.name).filter(Boolean);
    }
    categories = Array.from(new Set([...DEFAULT_CATS, ...fetched]));
  } catch {
    categories = [...DEFAULT_CATS];
  }
  renderCategorySelect();
}

document.getElementById("toggleNewCatBtn").addEventListener("click", () => {
  const box = document.getElementById("newCatBox");
  box.classList.toggle("open");
  if (box.classList.contains("open")) {
    document.getElementById("newCatInput").focus();
  }
});

document.getElementById("saveNewCatBtn").addEventListener("click", async () => {
  const input = document.getElementById("newCatInput");
  const msgEl = document.getElementById("prodMsg");
  const name = input.value.trim();
  if (!name) return;

  const catKey = "cat_" + Date.now();
  try {
    await dbPut(`/categories/${encodeURIComponent(catKey)}.json`, { id: catKey, name, createdAt: Date.now() });
    categories = Array.from(new Set([...categories, name]));
    renderCategorySelect(name);
    input.value = "";
    document.getElementById("newCatBox").classList.remove("open");
    msgEl.style.color = "var(--primary)";
    msgEl.textContent = `تمت إضافة القسم "${name}" واختياره بنجاح.`;
  } catch {
    msgEl.style.color = "var(--danger)";
    msgEl.textContent = "تعذر حفظ القسم الجديد حالياً.";
  }
});

/* ضغط الصورة تلقائياً لتكون خفيفة وسريعة الحفظ والمزامنة */
function compressImageFile(file, maxSize = 480, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        if (w > h && w > maxSize) {
          h = Math.round((h * maxSize) / w);
          w = maxSize;
        } else if (h >= w && h > maxSize) {
          w = Math.round((w * maxSize) / h);
          h = maxSize;
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateImagePreview(src, labelText = "") {
  const wrap = document.getElementById("imgPreviewWrap");
  const img = document.getElementById("imgPreview");
  const clearBtn = document.getElementById("clearImageBtn");
  const status = document.getElementById("imgStatusText");

  if (src) {
    img.src = src;
    wrap.style.display = "flex";
    clearBtn.style.display = "inline-block";
    if (labelText) status.textContent = labelText;
  } else {
    img.src = "";
    wrap.style.display = "none";
    clearBtn.style.display = "none";
    status.textContent = "اختر صورة من الهاتف أو الصق رابطاً";
  }
}

document.getElementById("pickImageBtn").addEventListener("click", () => {
  document.getElementById("prodImageFile").click();
});

document.getElementById("prodImageFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const status = document.getElementById("imgStatusText");
  status.textContent = "جاري تجهيز الصورة...";
  try {
    uploadedImageDataUrl = await compressImageFile(file, 480, 0.78);
    document.getElementById("prodImage").value = "";
    updateImagePreview(uploadedImageDataUrl, `تم اختيار: ${file.name}`);
  } catch {
    status.textContent = "تعذر قراءة الصورة المختارة.";
  }
});

document.getElementById("prodImage").addEventListener("input", (e) => {
  const url = e.target.value.trim();
  if (url) {
    uploadedImageDataUrl = "";
    updateImagePreview(url, "تم إدخال رابط صورة");
  } else if (!uploadedImageDataUrl) {
    updateImagePreview("");
  }
});

document.getElementById("clearImageBtn").addEventListener("click", () => {
  uploadedImageDataUrl = "";
  document.getElementById("prodImageFile").value = "";
  document.getElementById("prodImage").value = "";
  updateImagePreview("");
});

function normalizeProduct(key, val) {
  if (!val || typeof val !== "object") return null;
  if (val.deleted === true) return null;
  const name = String(val.name ?? val.title ?? "").trim();
  if (!name) return null;
  const id = String(val.id ?? key);
  return {
    id,
    name,
    price: Number(val.price ?? 0) || 0,
    category: String(val.category ?? "السلع الاساسيه").trim() || "السلع الاساسيه",
    image: String(val.image ?? "").trim(),
    description: String(val.description ?? "").trim()
  };
}

async function loadAdminProducts() {
  const raw = await dbGet("/products.json");
  const list = [];
  if (Array.isArray(raw)) {
    raw.forEach((v, idx) => {
      const p = normalizeProduct(v?.id ?? idx, v);
      if (p) list.push(p);
    });
  } else if (raw && typeof raw === "object") {
    Object.entries(raw).forEach(([k, v]) => {
      const p = normalizeProduct(k, v);
      if (p) list.push(p);
    });
  }
  products = list;
  document.getElementById("admProdCount").textContent = String(products.length);
  renderCategorySelect();
  renderAdminProducts();
}

function renderAdminProducts() {
  const container = document.getElementById("adminProductsList");
  if (products.length === 0) {
    container.innerHTML = `<div style="color:var(--muted);padding:10px 0;">لا توجد منتجات مضافة بعد.</div>`;
    return;
  }
  container.innerHTML = products.map(p => `
    <div class="item-row">
      <div style="display:flex;align-items:center;gap:10px;">
        ${p.image ? `<img src="${escapeHtml(p.image)}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border);" />` : ""}
        <div>
          <div style="font-weight:700;">${escapeHtml(p.name)} — <span style="color:var(--primary);">${p.price} جنيه</span></div>
          <div style="font-size:12px;color:var(--muted);">القسم: ${escapeHtml(p.category)} ${p.description ? "• " + escapeHtml(p.description) : ""}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <button type="button" class="btn-sm" data-edit="${escapeHtml(p.id)}">تعديل</button>
        <button type="button" class="btn-danger" data-del="${escapeHtml(p.id)}">حذف</button>
      </div>
    </div>
  `).join("");

  container.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-edit");
      const p = products.find(item => item.id === id);
      if (!p) return;
      document.getElementById("prodId").value = p.id;
      document.getElementById("prodName").value = p.name;
      document.getElementById("prodPrice").value = p.price;
      renderCategorySelect(p.category);
      document.getElementById("prodDesc").value = p.description;

      if (p.image && p.image.startsWith("data:")) {
        uploadedImageDataUrl = p.image;
        document.getElementById("prodImage").value = "";
        updateImagePreview(p.image, "صورة محفوظة للمنتج");
      } else {
        uploadedImageDataUrl = "";
        document.getElementById("prodImage").value = p.image || "";
        updateImagePreview(p.image || "", p.image ? "رابط صورة محفوظ" : "");
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  container.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-del");
      await dbDelete(`/products/${encodeURIComponent(id)}.json`);
      await loadAdminProducts();
    });
  });
}

function resetProductForm() {
  document.getElementById("productForm").reset();
  document.getElementById("prodId").value = "";
  uploadedImageDataUrl = "";
  document.getElementById("prodImageFile").value = "";
  updateImagePreview("");
  renderCategorySelect(DEFAULT_CATS[0]);
}

document.getElementById("productForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById("prodMsg");
  const existingId = document.getElementById("prodId").value.trim();
  const id = existingId || ("prod_" + Date.now() + "_" + Math.floor(Math.random() * 1000));
  const finalImage = uploadedImageDataUrl || document.getElementById("prodImage").value.trim();

  const payload = {
    id,
    name: document.getElementById("prodName").value.trim(),
    price: Number(document.getElementById("prodPrice").value) || 0,
    category: document.getElementById("prodCategory").value,
    image: finalImage,
    description: document.getElementById("prodDesc").value.trim(),
    active: true,
    deleted: false,
    updatedAt: Date.now()
  };

  try {
    await dbPut(`/products/${encodeURIComponent(id)}.json`, payload);
    resetProductForm();
    msgEl.style.color = "var(--primary)";
    msgEl.textContent = "تم حفظ المنتج بنجاح وسيظهر للعملاء فور التحديث.";
    await loadAdminProducts();
  } catch {
    msgEl.style.color = "var(--danger)";
    msgEl.textContent = "حدث خطأ أثناء حفظ المنتج في قاعدة البيانات.";
  }
});

document.getElementById("resetFormBtn").addEventListener("click", () => {
  resetProductForm();
  document.getElementById("prodMsg").textContent = "";
});

async function loadAdminOrders() {
  const raw = await dbGet("/orders.json");
  const list = raw && typeof raw === "object"
    ? Object.entries(raw).map(([k, v]) => ({ ...(v || {}), _id: v?.id || k })).filter(o => !o.deleted)
    : [];
  list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  document.getElementById("admOrdCount").textContent = String(list.length);
  const el = document.getElementById("adminOrdersList");
  if (list.length === 0) {
    el.innerHTML = `<div style="color:var(--muted);">لا توجد طلبات حالياً.</div>`;
    return;
  }
  el.innerHTML = list.map(o => {
    const itemsText = Array.isArray(o.items)
      ? o.items.map(i => `${escapeHtml(i.name)} × ${i.qty}`).join("، ")
      : "";
    return `
      <div class="item-row">
        <div>
          <div style="font-weight:700;">${escapeHtml(o._id)} — ${escapeHtml(o.customerName || "")} (${escapeHtml(o.customerPhone || o.phone || "")})</div>
          <div style="font-size:12px;color:var(--muted);">العنوان: ${escapeHtml(o.address || "")} • الإجمالي: ${escapeHtml(o.total ?? 0)} جنيه</div>
          ${itemsText ? `<div style="font-size:12px;margin-top:3px;">${itemsText}</div>` : ""}
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <select data-status-id="${escapeHtml(o._id)}" style="width:auto;">
            <option value="قيد التجهيز" ${o.status === "قيد التجهيز" ? "selected" : ""}>قيد التجهيز</option>
            <option value="قيد التوصيل" ${o.status === "قيد التوصيل" ? "selected" : ""}>قيد التوصيل</option>
            <option value="تم التسليم" ${o.status === "تم التسليم" ? "selected" : ""}>تم التسليم</option>
          </select>
          <button type="button" class="btn-danger" data-del-ord="${escapeHtml(o._id)}">حذف</button>
        </div>
      </div>
    `;
  }).join("");

  el.querySelectorAll("[data-status-id]").forEach(sel => {
    sel.addEventListener("change", async () => {
      const oid = sel.getAttribute("data-status-id");
      const target = list.find(x => x._id === oid);
      if (!target) return;
      const updated = { ...target, status: sel.value };
      delete updated._id;
      await dbPut(`/orders/${encodeURIComponent(oid)}.json`, updated);
    });
  });

  el.querySelectorAll("[data-del-ord]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const oid = btn.getAttribute("data-del-ord");
      await dbDelete(`/orders/${encodeURIComponent(oid)}.json`);
      await loadAdminOrders();
    });
  });
}

async function loadAdminComplaints() {
  const raw = await dbGet("/complaints.json");
  const list = raw && typeof raw === "object"
    ? Object.entries(raw).map(([k, v]) => ({ ...(v || {}), _id: v?.id || k }))
    : [];
  list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  document.getElementById("admSupCount").textContent = String(list.length);
  const el = document.getElementById("adminComplaintsList");
  if (list.length === 0) {
    el.innerHTML = `<div style="color:var(--muted);">لا توجد شكاوى أو استفسارات.</div>`;
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="item-row">
      <div>
        <div style="font-weight:700;">${escapeHtml(c.name || "")} (${escapeHtml(c.phone || "")})</div>
        <div style="font-size:13px;margin-top:3px;">${escapeHtml(c.message || "")}</div>
      </div>
      <button type="button" class="btn-danger" data-del-sup="${escapeHtml(c._id)}">حذف</button>
    </div>
  `).join("");

  el.querySelectorAll("[data-del-sup]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const sid = btn.getAttribute("data-del-sup");
      await dbDelete(`/complaints/${encodeURIComponent(sid)}.json`);
      await loadAdminComplaints();
    });
  });
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const targetTab = btn.getAttribute("data-tab");
    ["productsTab", "ordersTab", "complaintsTab"].forEach(id => {
      document.getElementById(id).classList.toggle("hidden", id !== targetTab);
    });
  });
});

async function refreshAll() {
  await loadCategories();
  await Promise.allSettled([loadAdminProducts(), loadAdminOrders(), loadAdminComplaints()]);
}

document.getElementById("reloadAllBtn").addEventListener("click", refreshAll);
refreshAll();
</script>
</body>
